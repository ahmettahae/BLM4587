# Her push ve pull request'te API ve mobil testleri çalıştırır.
name: Testler

on:
  push:
  pull_request:

jobs:
  api:
    name: API (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitapligim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Yalnız CI içindeki geçici test veritabanı ve anahtarı; gerçek değerler .env'de kalır.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/kitapligim
      JWT_SECRET: ci-gecici-test-anahtari-gercek-degil
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration
        run: alembic upgrade head
      - name: Testler
        run: python -m pytest -q

  mobil:
    name: Mobil (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Statik analiz
        run: flutter analyze
      - name: Testler
        run: flutter test
